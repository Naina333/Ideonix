<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ideonix - Explore Ideas</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">

<style>

/* RESET */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* VANTA CONTAINER */
#vanta-bg {
  width: 100%;
  min-height: 100vh;
}

/* BODY */
body {
  font-family: 'Poppins', sans-serif;
}

/* NAVBAR */
.navbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 40px;
  background:#8B5E3C;
  backdrop-filter: blur(6px);
  
}

.logo {
  font-size: 22px;
  font-weight: 600;
}

.nav-links a {
  margin: 0 15px;
  text-decoration: none;
  color: #333;
  font-weight: 500;
}

.nav-links a:hover {
  color: white;
}

/* CONTAINER */
.container {
  max-width: 700px;
  margin: 30px auto;
}

/* CARD */
.card {
  background: rgba(230, 200, 161, 0.9);
  backdrop-filter: blur(6px);
  border-radius: 20px;
  margin-bottom: 25px;
  overflow: hidden;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
  border: 2px solid #8B5E3C;
}

/* IMAGE */
.card img {
  width: 100%;
  height: 250px;
  object-fit: cover;
  display: block;
}

/* CONTENT */
.card-content {
  padding: 20px;
}

.username {
  font-size: 14px;
  color: gray;
  margin-bottom: 10px;
}

.card h3 {
  margin-bottom: 8px;
}

/* ACTIONS */
.actions {
  margin-top: 10px;
}

.actions button {
  border: none;
  background: none;
  margin-right: 15px;
  cursor: pointer;
  color: #8B5E3C;
  font-weight: 500;
}

/* COMMENT */
.comment-box input {
  width: 100%;
  padding: 8px;
  margin-top: 10px;
  border-radius: 10px;
  border: 1px solid #ccc;
}

.comment {
  font-size: 13px;
  margin-top: 5px;
}

</style>
</head>

<body>

<div id="vanta-bg">

  <!-- NAVBAR -->
  <div class="navbar">
    <div class="logo">Ideonix</div>

    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="postidea.html">Post Ideas</a>
      <a href="profile.html">Profile</a>
      <a href="login.html">Login</a>
      <a href="signup.html">Sign Up</a>
    </div>
  </div>

  <!-- FEED -->
  <div class="container" id="feed"></div>

</div>

<!-- THREE JS + VANTA -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>

<script>

// VANTA BACKGROUND
VANTA.NET({
  el: "#vanta-bg",
  mouseControls: true,
  touchControls: true,
  color: 0x8b5e3c,
  backgroundColor: 0xeae3d9,
  points: 10,
  maxDistance: 20,
  spacing: 18
});

// CLEAN IDEAS DATA (NO BROKEN LINKS)
let ideas = [
  {
    user: "Aarav",
    title: "AI Study Planner",
    desc: "An AI app that creates a smart study schedule based on your weak subjects.",
    image: "https://images.pexels.com/photos/17603742/pexels-photo-17603742.jpeg ",
    likes: 2,
    comments: ["Amazing!", "I need this"]
  },
  {
    user: "Ananya",
    title: "Smart Dustbin",
    desc: "A dustbin that automatically segregates waste using sensors.",
    image: "https://images.pexels.com/photos/27537456/pexels-photo-27537456.jpeg",
    likes: 5,
    comments: ["Very useful!", "Nice innovation"]
  },
  {
    user: "Rohan",
    title: "Lost & Found App",
    desc: "A platform where students can report lost and found items easily.",
    image: " https://images.pexels.com/photos/8684217/pexels-photo-8684217.jpeg",
    likes: 3,
    comments: ["Helpful!", "Good concept"]
  }
];

// DISPLAY IDEAS
function displayIdeas() {
  let feed = document.getElementById("feed");
  feed.innerHTML = "";

  ideas.forEach((idea, index) => {
    let card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <img src="${idea.image}" alt="idea" onerror="this.src='https://picsum.photos/800/250'">

      <div class="card-content">
        <h3>${idea.title}</h3>
        <div class="username">@${idea.user}</div>
        <p>${idea.desc}</p>

        <div class="actions">
          <button onclick="likeIdea(${index})">❤️ ${idea.likes}</button>
        </div>

        <div class="comment-box">
          <input placeholder="Add comment..." onkeypress="addComment(event, ${index})">
        </div>

        <div>
          ${idea.comments.map(c => `<div class="comment">💬 ${c}</div>`).join("")}
        </div>
      </div>
    `;

    feed.appendChild(card);
  });
}

// LIKE
function likeIdea(index) {
  ideas[index].likes++;
  displayIdeas();
}

// COMMENT
function addComment(event, index) {
  if (event.key === "Enter") {
    let text = event.target.value;

    if (text.trim() !== "") {
      ideas[index].comments.push(text);
      displayIdeas();
    }
  }
}

// LOAD
displayIdeas();

</script>

</body>
</html>
