<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Collaborate | Ideonix</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Poppins',sans-serif;color:#333;}

/* VANTA BACKGROUND */
#vanta-bg{min-height:100vh;width:100%;}

/* CONTAINER */
.container{width:90%;max-width:1100px;margin:auto;padding-top:30px;}

/* GLASS EFFECT */
.glass{
  background:rgba(255,255,255,0.85);
  backdrop-filter:blur(10px);
  border-radius:20px;
  padding:30px;
  margin-top:30px;
}

/* FOOTER */
.footer{
  margin-top:40px;padding:20px;text-align:center;
  background:rgba(255,255,255,0.8);border-radius:15px;
}

/* DARK MODE */
.dark{color:white;}
.dark .glass{background:rgba(0,0,0,0.6);}
.dark .footer{background:rgba(0,0,0,0.6);}

/* DARK TOGGLE BUTTON */
.dark-toggle{
  position:fixed;top:20px;right:20px;z-index:100;
  background:#8B5E3C;color:white;border:none;
  width:45px;height:45px;border-radius:50%;
  cursor:pointer;font-size:18px;
  box-shadow:0 4px 12px rgba(0,0,0,.2);
}

/* ===== COLLABORATION SECTION ===== */
.collab-header{text-align:center;margin-bottom:20px;}
.collab-header h1{font-size:32px;margin-bottom:8px;}
.collab-header p{color:#666;}
.dark .collab-header p{color:#ccc;}

.collab-toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px;}
.collab-toolbar input,.collab-toolbar select{
  flex:1;min-width:180px;padding:10px 14px;border:1px solid #ddd;
  border-radius:8px;background:white;font-family:inherit;outline:none;
}
.collab-toolbar input:focus{border-color:#8B5E3C;}
.dark .collab-toolbar input,.dark .collab-toolbar select{
  background:#2a2a2a;color:white;border-color:#444;
}

.collab-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;}
.collab-card{
  background:white;border-radius:15px;padding:20px;
  transition:.3s;border-left:4px solid #8B5E3C;
}
.collab-card:hover{transform:translateY(-6px);box-shadow:0 8px 20px rgba(0,0,0,.1);}
.dark .collab-card{background:#1e1e1e;}
.collab-card h3{margin-bottom:8px;color:#8B5E3C;}
.collab-card .desc{font-size:14px;margin-bottom:12px;color:#555;}
.dark .collab-card .desc{color:#bbb;}

.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
.tag{
  background:#f0e6dc;color:#8B5E3C;padding:3px 10px;
  border-radius:12px;font-size:12px;font-weight:500;
}
.dark .tag{background:#3a2d22;color:#e0c9b3;}

.card-meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#777;margin-bottom:12px;}
.dark .card-meta{color:#aaa;}

.join-btn{
  width:100%;background:#8B5E3C;color:white;border:none;
  padding:10px;border-radius:8px;cursor:pointer;font-weight:500;transition:.3s;
}
.join-btn:hover{background:#6f4a2e;}
.join-btn.joined{background:#4CAF50;}

.create-collab{display:none;margin-bottom:20px;}
.create-collab.active{display:block;}
.create-collab input,.create-collab textarea,.create-collab select{
  width:100%;padding:10px;margin-bottom:10px;
  border:1px solid #ddd;border-radius:8px;font-family:inherit;outline:none;
}
.create-collab textarea{resize:vertical;min-height:80px;}
.dark .create-collab input,.dark .create-collab textarea,.dark .create-collab select{
  background:#2a2a2a;color:white;border-color:#444;
}

.toggle-form-btn{
  background:#8B5E3C;color:white;border:none;padding:10px 20px;
  border-radius:8px;cursor:pointer;margin-bottom:20px;font-weight:500;
}

.progress{background:#eee;height:6px;border-radius:3px;overflow:hidden;margin-bottom:12px;}
.progress-fill{background:#8B5E3C;height:100%;transition:width .4s;}
.dark .progress{background:#333;}

.empty-state{text-align:center;padding:40px;color:#888;}
</style>
</head>

<body>

<!-- DARK MODE BUTTON -->
<button class="dark-toggle" onclick="toggleDark()">🌙</button>

<div id="vanta-bg">
<div class="container">

<!-- ===== COLLABORATION SECTION ===== -->
<div class="glass">
  <div class="collab-header">
    <h1>🤝 Collaborate on Ideas</h1>
    <p>Find teammates, join projects, and build something amazing together.</p>
  </div>

  <button class="toggle-form-btn" onclick="toggleForm()">➕ Start a Collaboration</button>

  <div class="create-collab" id="createForm">
    <input type="text" id="projTitle" placeholder="Project Title">
    <textarea id="projDesc" placeholder="Describe your project..."></textarea>
    <input type="text" id="projTags" placeholder="Skills needed (comma separated) e.g. React, UI, AI">
    <select id="projRoles">
      <option value="1">1 member needed</option>
      <option value="2">2 members needed</option>
      <option value="3">3 members needed</option>
      <option value="5">5 members needed</option>
      <option value="10">10 members needed</option>
    </select>
    <button class="join-btn" onclick="createProject()">Create Project</button>
  </div>

  <div class="collab-toolbar">
    <input type="text" id="searchInput" placeholder="🔍 Search projects..." oninput="renderProjects()">
    <select id="filterTag" onchange="renderProjects()">
      <option value="">All Categories</option>
      <option value="AI">AI / ML</option>
      <option value="Web">Web Dev</option>
      <option value="Mobile">Mobile</option>
      <option value="IoT">IoT</option>
      <option value="Design">Design</option>
    </select>
    <select id="sortBy" onchange="renderProjects()">
      <option value="new">Newest</option>
      <option value="popular">Most Popular</option>
      <option value="open">Most Open Spots</option>
    </select>
  </div>

  <div class="collab-grid" id="projectGrid"></div>
</div>

<!-- FOOTER -->
<div class="footer">
  <p>© 2026 Ideonix | All Rights Reserved</p>
</div>

</div>
</div>

<!-- VANTA SCRIPTS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>

<script>
VANTA.NET({
  el: "#vanta-bg",
  color: 0x8b5e3c,
  backgroundColor: 0xeae3d9,
  points: 10,
  maxDistance: 20,
  spacing: 18
});

function toggleDark(){
  document.body.classList.toggle("dark");
}

/* ===== COLLABORATION LOGIC ===== */
function toggleForm(){document.getElementById("createForm").classList.toggle("active");}

let projects = JSON.parse(localStorage.getItem("ideonix_projects")) || [
  {id:1,title:"AI Attendance System",desc:"Build a facial recognition based attendance tracker.",tags:["AI","Python","OpenCV"],needed:3,joined:1,owner:"Rahul"},
  {id:2,title:"Smart Waste IoT",desc:"Sensor-based smart bin with real-time monitoring.",tags:["IoT","Arduino","Web"],needed:4,joined:2,owner:"Priya"},
  {id:3,title:"Study Collab App",desc:"Platform where students can form study groups online.",tags:["Web","React","Node"],needed:5,joined:3,owner:"Aman"},
  {id:4,title:"Mental Health Bot",desc:"AI chatbot offering support and resources.",tags:["AI","Mobile","Design"],needed:2,joined:0,owner:"Sneha"}
];

function saveProjects(){localStorage.setItem("ideonix_projects",JSON.stringify(projects));}

function createProject(){
  const title=document.getElementById("projTitle").value.trim();
  const desc=document.getElementById("projDesc").value.trim();
  const tags=document.getElementById("projTags").value.split(",").map(t=>t.trim()).filter(Boolean);
  const needed=parseInt(document.getElementById("projRoles").value);
  if(!title||!desc){alert("Please fill title and description.");return;}
  projects.unshift({id:Date.now(),title,desc,tags,needed,joined:0,owner:"You"});
  saveProjects();renderProjects();toggleForm();
  document.getElementById("projTitle").value="";
  document.getElementById("projDesc").value="";
  document.getElementById("projTags").value="";
}

function joinProject(id){
  const p=projects.find(x=>x.id===id);
  if(p.joined>=p.needed && !p._userJoined){alert("This project is full!");return;}
  if(p._userJoined){p._userJoined=false;p.joined--;}
  else{p._userJoined=true;p.joined++;}
  saveProjects();renderProjects();
}

function renderProjects(){
  const q=document.getElementById("searchInput").value.toLowerCase();
  const filter=document.getElementById("filterTag").value;
  const sort=document.getElementById("sortBy").value;
  let list=[...projects];

  if(q)list=list.filter(p=>p.title.toLowerCase().includes(q)||p.desc.toLowerCase().includes(q)||p.tags.join(" ").toLowerCase().includes(q));
  if(filter)list=list.filter(p=>p.tags.some(t=>t.toLowerCase().includes(filter.toLowerCase())));
  if(sort==="popular")list.sort((a,b)=>b.joined-a.joined);
  if(sort==="open")list.sort((a,b)=>(b.needed-b.joined)-(a.needed-a.joined));

  const grid=document.getElementById("projectGrid");
  if(list.length===0){grid.innerHTML=`<div class="empty-state">🔍 No projects found.</div>`;return;}

  grid.innerHTML=list.map(p=>{
    const pct=Math.round((p.joined/p.needed)*100);
    const joined=p._userJoined;
    return `
      <div class="collab-card">
        <h3>${p.title}</h3>
        <p class="desc">${p.desc}</p>
        <div class="tags">${p.tags.map(t=>`<span class="tag">${t}</span>`).join("")}</div>
        <div class="progress"><div class="progress-fill" style="width:${pct}%"></div></div>
        <div class="card-meta">
          <span>👤 ${p.owner}</span>
          <span>${p.joined}/${p.needed} joined</span>
        </div>
        <button class="join-btn ${joined?'joined':''}" onclick="joinProject(${p.id})">
          ${joined?'✓ Joined (Leave)':'Join Project'}
        </button>
      </div>`;
  }).join("");
}

renderProjects();
</script>

</body>
</html>
