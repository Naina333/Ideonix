<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title> Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&family=Inter:wght@400;600&display=swap" rel="stylesheet">

<style>

/* RESET */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* BODY */
body {
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(135deg, #eae3d9, #d6cfc4);
}

/* MAIN */
.main {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* FRAME */
.bg-box {
  width: 95%;
  max-width: 1100px;
  border-radius: 32px;
  overflow: hidden;
  position: relative;
  border: 8px solid rgba(255,255,255,0.4);
  box-shadow: 0 25px 60px rgba(0,0,0,0.25);
  background: #f4ede4;
}

/* NAVBAR */
.navbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 18px 40px;
  background: #e9e1d6;
  border-bottom: 1px solid #d2c8bb;
}

/* LOGO */
.logo {
  font-size: 20px;
  font-weight: 600;
  color: #4a4035;
}

/* NAV LINKS */
.nav-links {
  display: flex;
  gap: 30px;
}

.nav-links a {
  text-decoration: none;
  color: #4a4035;
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  transition: 0.3s;
}

.nav-links a:hover {
  color: #8B5E3C;
}

/* RIGHT SIDE */
.nav-right {
  display: flex;
  align-items: center;
  gap: 20px;
}

/* SEARCH */
.search-box {
  padding: 6px 10px;
  border-radius: 15px;
  border: 1px solid #ccc;
  background: white;
  font-size: 12px;
}

/* BACKGROUND IMAGE */
.bg-image {
  position: relative;
}

.bg-image img {
  width: 100%;
  height: 520px;
  object-fit: cover;
  filter: brightness(0.65);
  opacity: 0.5;
}

/* LOGIN CARD */
.login-card {
  position: absolute;
  top: 60%;
  left: 50%;
  transform: translate(-50%, -50%);
  
  width: 380px;
  padding: 45px;
  border-radius: 20px;
  background: rgba(244, 237, 228, 0.95);
  text-align: center;
  box-shadow: 0 15px 40px rgba(0,0,0,0.2);
}

/* TITLE */
.login-card h2 {
  font-size: 30px;
  margin-bottom: 25px;
}

/* INPUT */
.input-box {
  text-align: left;
  margin-bottom: 20px;
}

.input-box label {
  font-size: 14px;
}

.input-box input {
  width: 100%;
  border: none;
  border-bottom: 1px solid #aaa;
  padding: 8px 0;
  background: transparent;
  outline: none;
}

/* BUTTON */
.login-btn {
  width: 100%;
  padding: 12px;
  background: #8B5E3C;
  color: white;
  border: none;
  border-radius: 25px;
  margin-top: 20px;
  cursor: pointer;
}

.signup-btn {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  border: 1px solid #8B5E3C;
  border-radius: 25px;
  background: transparent;
  cursor: pointer;
}

.link {
  margin-top: 15px;
  font-size: 13px;
  color: #8B5E3C;
}

</style>
</head>

<body>

<div class="main">

  <div class="bg-box">

    <!-- NAVBAR -->
    <div class="navbar">
      <div class="logo">Ideonix</div>

      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="postidea.html">Post ideas</a>
        <a href="getideas.html">Get ideas</a>
        <a href="profile.html">Profile</a>
      </div>

      <div class="nav-right">
        <input type="text" placeholder="Search" class="search-box">
        <span>Login</span>
        
      </div>
    </div>

    <!-- BACKGROUND IMAGE -->
    <div class="bg-image">
      <img src="https://media.istockphoto.com/id/522630664/photo/brainstoming-gruoup-of-people-working-concept.jpg?s=2048x2048&w=is&k=20&c=7_0YFmbsEmXCZVt5GLs7a3TteVSowgAao5lFZRl2fZE=" >

      <!-- LOGIN CARD -->
      <div class="login-card">
        <h2>Account</h2>

        <div class="input-box">
          <label>E-mail</label>
          <input type="email">
        </div>

        <div class="input-box">
          <label>Password</label>
          <input type="password">
        </div>

        <!--button class="login-btn">LOGIN</button>-->
        <button class="login-btn" onclick="login()">LOGIN</button>
        <a href="signup.html"> <button class="signup-btn">CREATE AN ACCOUNT</button></a>

        <div class="link">Forgot password?</div>
      </div>

    </div>

  </div>

</div>
<script>
function login() {
  let email = document.querySelector('input[type="email"]').value;
  let password = document.querySelector('input[type="password"]').value;

  let storedUser = JSON.parse(localStorage.getItem("user"));

  if (storedUser && email === storedUser.email && password === storedUser.password) {
    localStorage.setItem("loggedInUser", JSON.stringify(storedUser));
    window.location.href = "profile.html";
  } else {
    alert("Invalid details");
  }
}
</script>
</body>
</html>
